<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인도네시아어 맞춤단어장</title>
    <!-- Google Identity Services for OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <!-- [v19.15] 초강력 캐시 버스터 및 오염 스토리지 원천 클렌징 스크립트 -->
    <script>
      // 1. 모든 활성화된 서비스 워커 해제
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) {
            r.unregister().then(function(success) {
              if (success) console.log('[캐시버스터] 서비스 워커 성공적으로 강제 해제 완료');
            });
          }
        });
      }
      // 2. 모든 브라우저 캐시 스토리지(CacheStorage) 완벽히 소거
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          keys.forEach(function(key) {
            caches.delete(key).then(function() {
              console.log('[캐시버스터] 캐시 스토리지 삭제 완료:', key);
            });
          });
        });
      }
      // 3. localStorage 내 잘못 설정된 프리미엄 TTS 모델명 원천 폐기 및 초기화
      ['google_tts_model_ko','google_tts_model_id','google_tts_model_en'].forEach(function(key) {
        var val = localStorage.getItem(key);
        if (val && (val.indexOf('gemini') !== -1 || val.indexOf('-') === -1)) {
          console.warn('[캐시버스터] 오염된 TTS 설정값 강제 삭제:', key, '->', val);
          localStorage.removeItem(key);
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
